openapi: 3.0.0
info:
  title: Sample API
  version: '1.0'
paths:
  /users:
    get:
      summary: Get a list of users
      responses:
        '200':
          description: A JSON array of user objects
    post:
      summary: Create a new user
      responses:
        '201':
          description: User created successfully
  /users/{id}:
    get:
      summary: Get a specific user by ID
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: User ID
      responses:
        '200':
          description: A user object
    put:
      summary: Update a specific user
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: User ID
      responses:
        '200':
          description: User updated successfully
    delete:
      summary: Delete a specific user
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: User ID
      responses:
        '204':
          description: User deleted successfully
